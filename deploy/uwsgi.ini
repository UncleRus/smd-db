; uWSGI configuration for the SMD-DB Flask application on rpi41.
;
; uWSGI itself comes from the distribution, not from pip:
;   apt-get install uwsgi-core uwsgi-plugin-python3
; The application's Python packages (Flask, Jinja2) live in the virtualenv
; below, which the python3 plugin picks up.
;
; Deployed as /opt/smd-db/ (package app/, templates/, static/, smd.sqlite).
;
; nginx talks to uWSGI over the local port below (uwsgi protocol, as expected
; by nginx's ``uwsgi_pass``). Keep the port in sync with
; ``deploy/nginx-smd-db.conf``.

[uwsgi]
; --- application ---
chdir = /opt/smd-db
module = wsgi:application
callable = application
need-app = true

; --- python ---
; Load the distribution python3 plugin and run against the project virtualenv.
plugins = python3
virtualenv = /opt/smd-db/.venv
single-interpreter = true

; --- workers ---
; One SQLite connection per request (flask.g), so threads and processes are
; both safe. Tune for the Pi.
master = true
processes = 4
threads = 4
enable-threads = true

; --- socket (nginx -> uWSGI) ---
socket = 127.0.0.1:5000
; uwsgi protocol is the uWSGI default and what nginx's uwsgi_pass speaks.

; --- lifecycle ---
vacuum = true
die-on-term = true
harakiri = 30
max-requests = 5000

; --- logging ---
log-4xx = true
log-5xx = true
