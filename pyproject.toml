[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["app", "run.py", "wsgi.py", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
